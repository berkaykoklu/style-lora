[project]
name = "style-lora"
version = "0.1.0"
description = "Teaching a style with LoRA, and measuring what it costs in prompt adherence"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "torch>=2.5",
    "diffusers>=0.32",
    "transformers>=4.46",
    "peft>=0.14",
    "pillow>=11.0",
    "accelerate>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stylelora"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["stylelora", "tests"]
strict = true

[[tool.mypy.overrides]]
# None of these ship type stubs.
module = ["diffusers.*", "peft.*", "accelerate.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers ships no annotations, so nn.Module methods like eval() read as
# untyped calls. The gap is the library's, not ours, and narrowing it to the
# modules that touch it keeps the rest of the package strict.
module = ["stylelora.score", "stylelora.train", "stylelora.generate"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
